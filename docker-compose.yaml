services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      # 5433 на хосте, чтобы не конфликтовать с локально установленным PostgreSQL
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты выполняются при первом запуске (на пустом volume) в алфавитном порядке:
      # сначала схема, затем загрузка данных (10 аккаунтов, 30 услуг, 100 транзакций)
      - ./origin_data/001_schema.up.sql:/docker-entrypoint-initdb.d/001_schema.up.sql:ro
      - ./origin_data/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Внутри сети compose база доступна по имени сервиса
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Адрес API подставляется в сборку фронта на этапе build
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
