services:
  db:
    image: postgres:17
    # Логин, пароль и имя базы берутся из того же файла, что и у api, чтобы они не расходились
    env_file:
      - ./backend/.env
    ports:
      # 5433 на хосте, чтобы не конфликтовать с локальным PostgreSQL; наружу не публикуется
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Схему создаёт Alembic при старте api, данные грузит само приложение из origin_data
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Внутри сети compose база доступна по имени сервиса
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Исходный снимок (10 аккаунтов, 30 услуг, 100 транзакций): при старте грузится в пустую базу
      SOURCE_DATA_PATH: /data/data.json
    volumes:
      - ./origin_data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Адрес API подставляется в сборку фронта на этапе build
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # --- Наблюдаемость: Prometheus опрашивает /metrics, Grafana строит дашборды и алерты (ops/README.md) ---
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Только для локальной отладки PromQL (/graph, /targets) — наружу не публикуется
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    # GF_SECURITY_ADMIN_PASSWORD — тот же файл, что и остальные секреты (см. authentik-server);
    # имя переменной должно совпадать с тем, что ждёт сама Grafana (env_file кладёт как есть)
    env_file:
      - ./backend/.env
    environment:
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # --- Authentik: отдельный OIDC-провайдер для входа в панель (backend/app/routers/oidc.py) ---
  # Своя БД и Redis, изолированные от основного Postgres — наружу не публикуются,
  # поэтому фиксированные учётные данные ниже не секрет (виден только внутри сети compose).
  authentik-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_DB: authentik
    volumes:
      - authentik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  authentik-redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.2
    command: server
    # AUTHENTIK_SECRET_KEY и AUTHENTIK_BOOTSTRAP_* — настоящие секреты, берутся из backend/.env
    env_file:
      - ./backend/.env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
    ports:
      - "9000:9000"
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.2
    command: worker
    env_file:
      - ./backend/.env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  authentik-db-data:
  authentik-media:
  authentik-certs:
  prometheus-data:
  grafana-data:
