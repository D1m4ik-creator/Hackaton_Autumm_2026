# Для websocket'ов Grafana Live; на обычных HTTP-запросах не мешает
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name full-stack-hack.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name full-stack-hack.ru;

    ssl_certificate     /etc/nginx/certs/domain.crt;
    ssl_certificate_key /etc/nginx/certs/domain.key;

    # Имя api резолвим через DNS Docker на каждый запрос, а не один раз при старте:
    # иначе nginx падает с "host not found in upstream", если api ещё не в сети,
    # и держит его старый IP после пересоздания контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # API и метрики — через тот же домен, бэк доступен по имени сервиса в сети compose
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /metrics {
        set $metrics_upstream http://api:8000;
        proxy_pass $metrics_upstream;
        proxy_set_header Host $host;
    }

    # Проверка сессии панели для auth_request: 200 — залогинен, 401 — нет.
    # auth_request шлёт подзапрос с методом оригинала (у Grafana много POST'ов),
    # а /auth/me принимает только GET — поэтому proxy_method.
    location = /__auth {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        set $auth_upstream http://api:8000/api/v1/auth/me;
        proxy_pass $auth_upstream;
    }

    # Grafana — на том же домене под /grafana/ (на сервере нужны GF_SERVER_ROOT_URL и
    # GF_SERVER_SERVE_FROM_SUB_PATH=true в backend/.env, см. backend/.env.example).
    # Анонимный Viewer включён в Grafana ради iframe в панели, поэтому снаружи
    # подпуть закрыт сессией панели через auth_request.
    location /grafana/ {
        auth_request /__auth;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
