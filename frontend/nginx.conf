server {
    listen 80;
    server_name full-stack-hack.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name full-stack-hack.ru;

    ssl_certificate     /etc/nginx/certs/domain.crt;
    ssl_certificate_key /etc/nginx/certs/domain.key;

    # Имя api резолвим через DNS Docker на каждый запрос, а не один раз при старте:
    # иначе nginx падает с "host not found in upstream", если api ещё не в сети,
    # и держит его старый IP после пересоздания контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # API и метрики — через тот же домен, бэк доступен по имени сервиса в сети compose
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /metrics {
        set $metrics_upstream http://api:8000;
        proxy_pass $metrics_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
