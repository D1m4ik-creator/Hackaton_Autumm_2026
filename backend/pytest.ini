[pytest]
# backend/ — для импортов app.*, app/predictt_model — для существующего test_churn_model.py
pythonpath = . app/predictt_model
testpaths = tests app
asyncio_mode = auto
# Глобальный engine из app.core.engine живёт весь прогон: все async-тесты и фикстуры
# должны работать в одном event loop, иначе соединения asyncpg «привязаны» к чужому циклу
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
