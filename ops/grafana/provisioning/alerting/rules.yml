apiVersion: 1

groups:
  - orgId: 1
    name: churn-alerts
    folder: Churn Alerts
    interval: 1m
    rules:
      - uid: churn-high-risk-count
        title: "Высокий риск: слишком много клиентов"
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "Клиентов с высоким риском больше порога (5)"
        labels: {}
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'churn_customers{level="high"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expr: ""
              refId: C
              conditions:
                - evaluator: { type: gt, params: [5] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }

      - uid: churn-loss-growth
        title: "Ожидаемые потери выросли больше чем на 20% за сутки"
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "Ожидаемые потери выросли больше чем на 20% за последние 24 часа"
        labels: {}
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "(churn_expected_loss_eurocents - churn_expected_loss_eurocents offset 24h) / churn_expected_loss_eurocents offset 24h * 100"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expr: ""
              refId: C
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }

      - uid: churn-stale-data
        title: "Данные протухли: давно не было пересчёта"
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "Пересчёта не было больше 6 часов — данные в панели устарели"
        labels: {}
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "time() - churn_last_recalculation_timestamp_seconds"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expr: ""
              refId: C
              conditions:
                - evaluator: { type: gt, params: [21600] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
